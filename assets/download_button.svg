<svg xmlns="http://www.w3.org/2000/svg" width="420" height="68" viewBox="0 0 420 68" fill="none">
  <defs>
    <!-- Background Glassmorphism Gradient -->
    <linearGradient id="glassBg" x1="0" y1="0" x2="420" y2="68" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#16152B" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#21173D" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0E192E" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Glass Border Gradient -->
    <linearGradient id="glassBorder" x1="0" y1="0" x2="420" y2="68" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#00F2FE" stop-opacity="0.7"/>
    </linearGradient>

    <!-- Glass Top Sheen -->
    <linearGradient id="topSheen" x1="0" y1="0" x2="0" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Neon Text & Accent Gradient -->
    <linearGradient id="neonGradient" x1="0" y1="0" x2="100%" y2="0">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="50%" stop-color="#9333EA"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <!-- Badge Background -->
    <linearGradient id="badgeBg" x1="0" y1="0" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <!-- Outer Glow Shadow -->
    <filter id="neonGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#7F52FF" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Button Base Container with Shadow Glow -->
  <rect x="4" y="4" width="412" height="60" rx="16" fill="url(#glassBg)" filter="url(#neonGlow)"/>

  <!-- Glass Top Reflection Sheen -->
  <rect x="4" y="4" width="412" height="28" rx="16" fill="url(#topSheen)"/>

  <!-- Glass Border Stroke -->
  <rect x="4.5" y="4.5" width="411" height="59" rx="15.5" stroke="url(#glassBorder)" stroke-width="1.5" fill="none"/>

  <!-- Icon: Lightning + Download Arrow -->
  <g transform="translate(22, 18)">
    <!-- Cyan Glowing Circle Container -->
    <circle cx="16" cy="16" r="16" fill="#7C3AED" fill-opacity="0.3" stroke="#00F2FE" stroke-width="1.2"/>
    <!-- Android / Download Arrow Path -->
    <path d="M16 8V20M16 20L11 15M16 20L21 15" stroke="#00F2FE" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M10 24H22" stroke="#A855F7" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Button Title Text -->
  <text x="68" y="35" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" letter-spacing="0.5">
    DOWNLOAD DISCORDMINI
  </text>
  
  <text x="68" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="500" fill="#A78BFA" letter-spacing="0.3">
    Official Android APK &bull; Fast &amp; Direct
  </text>

  <!-- Version Pill Badge -->
  <rect x="328" y="20" width="70" height="28" rx="14" fill="url(#badgeBg)"/>
  <rect x="328.5" y="20.5" width="69" height="27" rx="13.5" stroke="#ffffff" stroke-opacity="0.3" fill="none"/>
  <text x="363" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">
    v1.0.0
  </text>
</svg>
